# FlameDE live-session identity. Without this casper falls back to the Ubuntu
# defaults (user/host "ubuntu"), so LightDM autologin-user=flamelive never matches.
# Precedent: casper's shipped /etc/casper.conf in the 26.10 image.
export USERNAME="flamelive"
export USERFULLNAME="FlameDE live session"
export HOST="flamede"
export BUILD_SYSTEM="Ubuntu"
# Non-empty FLAVOUR makes casper honour USERNAME/HOST above.
export FLAVOUR="FlameDE"
