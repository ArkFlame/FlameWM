# flamede-blacklist.conf - kernel modules blocked on FlameDE. Installed to /etc/modprobe.d/.
# Blocklisting only stops automatic loading; manual modprobe still works.

# Watchdog drivers: no hardware watchdog petting on a desktop (see sysctl and system.conf.d).
blacklist iTCO_wdt
blacklist iTCO_vendor_support
blacklist sp5100_tco
blacklist softdog

# Legacy/obsolete framebuffer and sound drivers that conflict with KMS and PipeWire.
blacklist pcspkr
blacklist snd_pcsp

# Floppy controller: no floppy hardware, avoids a boot-time probe delay.
blacklist floppy

# FireWire stack: rarely used on desktops; blocked to shrink attack surface on live images.
blacklist firewire_ohci
blacklist firewire_sbp2

# Thunderbolt is kept (external GPU and docks need it), so it is intentionally not listed.
