# 99-flamede.conf - desktop memory and I/O tuning for FlameDE.
# Applies at boot via systemd-sysctl. Values favour responsiveness on 4-16 GB laptops.

# Swap: zram is the primary swap device (zram-generator). Prefer reclaiming anonymous
# pages into compressed RAM over evicting file cache. 100 is the upper bound that
# systemd and kernel docs accept for zram-backed swap.
vm.swappiness = 100

# Keep dentry/inode caches a little longer than default (default 100). Reduces disk
# re-reads when browsing large trees in the file manager.
vm.vfs_cache_pressure = 50

# Writeback: start background flush at 5% dirty RAM, block writers at 15%.
# Ubuntu default is 10/20; lower values smooth out stalls on SATA and eMMC storage.
vm.dirty_background_ratio = 5
vm.dirty_ratio = 15

# Kernel watchdogs are off. Desktop hangs are handled by earlyoom and the user;
# the soft and hard lockup detectors add periodic IPIs and noise on laptops.
kernel.watchdog = 0
kernel.nmi_watchdog = 0

# Page cluster for swap readahead: 0 is correct for zram (no seek cost).
vm.page-cluster = 0

# Unprivileged user namespaces are left at the Ubuntu default. AppArmor's
# kernel.apparmor_restrict_unprivileged_userns is the Ubuntu knob; FlameDE does not override it.
