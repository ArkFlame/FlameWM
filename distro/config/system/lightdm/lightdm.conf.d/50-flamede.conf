# 50-flamede.conf - LightDM policy for FlameDE. Installed to /etc/lightdm/lightdm.conf.d/.
# Keys follow the seat.c property names in .vendor/lightdm-main/src/seat.c:
#   user-session, greeter-session, autologin-user, autologin-user-timeout, autologin-session.
# The live image sets autologin; the installed system does not, because the installer
# removes this drop-in and the user creates the account (see DESIGN.md section 6).

[Seat:*]
# Session launched after login. The FlameWM session file is installed by the flamewm .deb.
user-session=flamewm
# Session used when no user has logged in yet is the greeter itself.
greeter-session=lightdm-gtk-greeter
# Session chosen by autologin if the user is not overridden.
autologin-session=flamewm
# Live user only. 'ubuntu' is the live account created by casper; the installed system removes this file.
autologin-user=flamelive
# Zero: autologin happens immediately without a countdown.
autologin-user-timeout=0
# Guest sessions are disabled on FlameDE (no guest account in the image).
allow-guest=false
# Do not show the user list; show the username and password fields.
greeter-hide-users=true
# Greeter cosmetic defaults: show the clock, no a11y layout unless requested.
greeter-show-manual-login=true
