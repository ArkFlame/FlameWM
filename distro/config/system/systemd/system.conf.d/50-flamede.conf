# 50-flamede.conf - manager defaults for FlameDE. Installed to /etc/systemd/system.conf.d/.

[Manager]
# Shutdown: give services 10 s to stop before SIGKILL. Ubuntu default is 90 s, which makes
# hung apps stall power-off for a minute and a half.
DefaultTimeoutStopSec=10s
# Start and stop timeouts for units without explicit values.
DefaultTimeoutStartSec=30s
# Per-unit memory accounting off: avoids the cgroup memory controller overhead on every unit.
# earlyoom and per-app limits cover the cases accounting was used for.
DefaultMemoryAccounting=no
# CPU and IO accounting stay at the systemd default (off) for the same reason; enable per unit if needed.
DefaultCPUAccounting=no
DefaultIOAccounting=no
# Hardware watchdog off: no /dev/watchdog petting on a desktop.
RuntimeWatchdogSec=0
RebootWatchdogSec=0
KExecWatchdogSec=0
