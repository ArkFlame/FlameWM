# zram-generator.conf - compressed RAM swap for FlameDE. Installed to /etc/systemd/zram-generator.conf.
# Used by the systemd-zram-generator package (zram-tools is NOT installed; one swap tool only).
# Requires the kernel zram module (built in on Ubuntu generic).

[zram0]
# Size: half of RAM, capped at 8 GiB. On 4 GB laptops this gives 2 GB of compressed swap.
zram-size = min(ram / 2, 8192)
# zstd gives the best ratio per CPU cycle for desktop workloads; falls back to lzo-rle on old kernels.
compression-algorithm = zstd
# Swap priority above any disk swap so zram is used first.
swap-priority = 100
# Swap device, not a block filesystem.
fs-type = swap
