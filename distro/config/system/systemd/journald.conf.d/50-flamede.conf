# 50-flamede.conf - journald policy for FlameDE. Installed to /etc/systemd/journald.conf.d/.
# journald is the single logger (rsyslog purged in packages/remove.list).
[Journal]
# Volatile: logs live in /run (tmpfs). No SSD writes from logging on a live or installed desktop.
# Trade-off: logs do not survive reboot. Use Storage=auto on systems that need persistent logs.
Storage=volatile
# Cap the tmpfs journal at 64 MB; keeps RAM use bounded on 4 GB machines.
RuntimeMaxUse=64M
# Drop old entries once the runtime journal is full, not the whole set.
RuntimeKeepFree=64M
# Forward nothing to syslog sockets or the console; keeps the TTY quiet.
ForwardToSyslog=no
ForwardToConsole=no
# Rate limit chatty services: 1000 messages per 30 s per service.
RateLimitIntervalSec=30s
RateLimitBurst=1000
