---
# Calamares for FlameDE. Install to /etc/calamares; branding to /usr/share/calamares/branding/flamede.
# Exec order: partition -> unpack the live squashfs -> system config -> cleanup -> packages -> boot.
modules-search: [ local, /usr/lib/calamares/modules ]
instances:
  - id: zram
    module: packages
    config: packages-zram.conf
  - id: zram
    module: shellprocess
    config: shellprocess-zram.conf
  - id: cleanup
    module: shellprocess
    config: shellprocess-cleanup.conf
sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - networkcfg
      - hwclock
      - removeuser
      - shellprocess@cleanup
      - packages
      - packages@zram
      - shellprocess@zram
      - services-systemd
      - displaymanager
      - bootloader
      - umount
  - show:
      - finished
branding: flamede
prompt-install: false
dont-chroot: false
