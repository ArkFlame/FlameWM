---
efiSystemPartition: "/boot/efi"
efiSystemPartitionSize: 512M
efiSystemPartitionName: "EFI"
# Ext4 only: no btrfs, xfs or ZFS choices. Swap is zram (see packages-zram.conf), so no swap partition.
defaultFileSystemType: "ext4"
availableFileSystemTypes: [ "ext4" ]
initialPartitioningChoice: "erase"
initialSwapChoice: "none"
userSwapChoices: [ none ]
# Erase-disk layout: EFI (above) plus one ext4 root that takes the rest of the disk. Without this
# block the erase choice creates only the EFI partition and the install has no root filesystem.
partitionLayout:
  - name: "rootfs"
    filesystem: "ext4"
    mountPoint: "/"
    size: 100%
allowManualPartitioning: true
drawNestedPartitions: false
enableLuksAutomatedPartitioning: false
requiredStorageGiB: 20
recommendedStorageGiB: 40
