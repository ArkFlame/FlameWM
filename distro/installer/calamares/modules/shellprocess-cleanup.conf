---
# Drops live-only boot config and rebuilds the initramfs without casper hooks.
dontChroot: false
timeout: 600
script:
  - "rm -f /etc/casper.conf"
  - "rm -f /etc/lightdm/lightdm.conf.d/*live*.conf"
  - "for f in /etc/lightdm/lightdm.conf.d/*.conf /etc/sudoers.d/*; do [ -f \"$f\" ] && grep -q flamelive \"$f\" && rm -f \"$f\"; done; true"
  - "update-initramfs -u -k all"
