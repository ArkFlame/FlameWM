---
# Drops live-only boot config and rebuilds the initramfs without casper hooks.
dontChroot: false
timeout: 600
script:
  - "rm -f /etc/casper.conf"
  - "rm -f /etc/lightdm/lightdm.conf.d/*live*.conf"
  # Calamares rewrites $name in shell scripts as a variable, so no shell loops over "$f" here.
  - "sed -i -e '/^autologin-/d' /etc/lightdm/lightdm.conf.d/*.conf; true"
  - "grep -rl flamelive /etc/sudoers.d | xargs -r rm -f; true"
  - "update-initramfs -u -k all"
