---
# Live-only packages stripped from the installed system. Keep initramfs-tools and linux-generic: the installed system needs them.
backend: "apt"
update_db: false
update_system: false
skip_if_no_internet: false
operations:
  - remove:
      - casper
      - lupin-casper
      - discover
      - laptop-detect
      - live-config
      - live-config-systemd
      - live-boot
      - live-boot-initramfs-tools
      - ubiquity
      - ubiquity-frontend-gtk
      - ubiquity-slideshow-ubuntu
      - calamares
