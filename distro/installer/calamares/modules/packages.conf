---
# Live-only packages stripped from the installed system. Keep initramfs-tools and linux-generic: the installed system needs them.
backend: "apt"
update_db: false
update_system: false
skip_if_no_internet: false
operations:
  # Only packages the image actually installs (dpkg status of the squashfs). apt-get remove aborts the
  # whole job on any unknown name, and the target chroot has no apt lists, so absent names must not appear.
  # Absent in the image as of 0.1.7 (add back only if the image starts shipping them): lupin-casper,
  # laptop-detect, live-boot, live-boot-initramfs-tools, ubiquity, ubiquity-frontend-gtk, ubiquity-slideshow-ubuntu.
  - remove:
      - casper
      - discover
      - live-config
      - live-config-systemd
      - calamares
