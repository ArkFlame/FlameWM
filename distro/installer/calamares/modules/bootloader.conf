---
# GRUB for UEFI (Secure Boot via signed shim/grub from base.list) and BIOS (grub-pc-bin).
efiBootLoader: "grub"
efiBootMgr: "efibootmgr"
efiBootloaderId: "ubuntu"   # signed grubx64.efi has its prefix baked to EFI/ubuntu (Ubuntu installer precedent); any other id leaves grub with no config
installEFIFallback: true
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubProbe: "grub-probe"
grubCfg: "/boot/grub/grub.cfg"
grubSetup: "/usr/sbin/grub-setup"
kernelSearchPath: "/usr/lib/modules"
kernelPattern: "vmlinuz-*"
timeout: 5
