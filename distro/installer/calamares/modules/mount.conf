---
# Bind and pseudo mounts into the target before any chrooted job (packages, bootloader, initramfs).
# Without these, grub-install cannot resolve /boot/efi ("cannot find a device for /boot/efi").
# Same layout as upstream Calamares mount.conf.
extraMounts:
  - device: proc
    fs: proc
    mountPoint: /proc
  - device: sys
    fs: sysfs
    mountPoint: /sys
  # options must be YAML lists: a bare string is split into characters ("-o b,i,n,d") by this Calamares.
  - device: /dev
    mountPoint: /dev
    options: [ bind ]
  - device: tmpfs
    fs: tmpfs
    mountPoint: /run
  - device: /run/udev
    mountPoint: /run/udev
    options: [ bind ]
extraMountsEfi:
  - device: efivarfs
    fs: efivarfs
    mountPoint: /sys/firmware/efi/efivars
