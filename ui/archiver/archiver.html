<!doctype html><html><head><meta charset="utf-8"><title>FlameWM Archiver</title><link rel="stylesheet" href="../base/base.css"><link rel="stylesheet" href="archiver.css"></head><body id="archiver">
  <div class="top"><span id="title" class="title">FlameWM Archiver</span><span id="archive-name" class="meta">-</span></div>
  <div class="body">
    <div id="list" class="list">
      <div id="row-0" class="row" data-action="ar.row0"><span id="row-0-name" class="name">-</span><span id="row-0-meta" class="meta">-</span></div>
      <div id="row-1" class="row" data-action="ar.row1"><span id="row-1-name" class="name">-</span><span id="row-1-meta" class="meta">-</span></div>
      <div id="row-2" class="row" data-action="ar.row2"><span id="row-2-name" class="name">-</span><span id="row-2-meta" class="meta">-</span></div>
      <div id="row-3" class="row" data-action="ar.row3"><span id="row-3-name" class="name">-</span><span id="row-3-meta" class="meta">-</span></div>
      <div id="row-4" class="row" data-action="ar.row4"><span id="row-4-name" class="name">-</span><span id="row-4-meta" class="meta">-</span></div>
      <div id="row-5" class="row" data-action="ar.row5"><span id="row-5-name" class="name">-</span><span id="row-5-meta" class="meta">-</span></div>
      <div id="row-6" class="row" data-action="ar.row6"><span id="row-6-name" class="name">-</span><span id="row-6-meta" class="meta">-</span></div>
      <div id="row-7" class="row" data-action="ar.row7"><span id="row-7-name" class="name">-</span><span id="row-7-meta" class="meta">-</span></div>
      <div id="row-8" class="row" data-action="ar.row8"><span id="row-8-name" class="name">-</span><span id="row-8-meta" class="meta">-</span></div>
      <div id="row-9" class="row" data-action="ar.row9"><span id="row-9-name" class="name">-</span><span id="row-9-meta" class="meta">-</span></div>
      <div id="row-10" class="row" data-action="ar.row10"><span id="row-10-name" class="name">-</span><span id="row-10-meta" class="meta">-</span></div>
      <div id="row-11" class="row" data-action="ar.row11"><span id="row-11-name" class="name">-</span><span id="row-11-meta" class="meta">-</span></div>
    </div>
    <div id="toolbar" class="toolbar">
      <span class="btn" data-action="ar.prev">Prev</span>
      <span id="page" class="meta">Page 1 / 1</span>
      <span class="btn" data-action="ar.next">Next</span>
      <span class="spacer"></span>
      <span class="btn" data-action="ar.selected">Extract selected</span>
      <span class="btn primary" data-action="ar.all">Extract all</span>
    </div>
    <div id="progress" class="progress">
      <div class="track"><div id="progress-fill" class="fill"></div></div>
      <span id="progress-text" class="meta">0%</span>
      <span class="btn" data-action="ar.cancel">Cancel</span>
    </div>
    <span id="status" class="status">Ready</span>
  </div>
</body></html>
