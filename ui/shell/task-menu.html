<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>FlameWM task menu</title>
  <link rel="stylesheet" href="flamewm.css">
</head>
<body class="popup-body">
  <section id="task-menu" class="context-menu compact-context" data-action="task.menu.surface">
    <button id="context-task-activate" class="menu-row" data-action="task.menu.activate"><img class="symbolic-icon" src="assets/breeze/window-maximize.svg" width="16" height="16"><div>Activate</div></button>
    <button id="context-task-close" class="menu-row" data-action="task.menu.close"><img class="symbolic-icon" src="assets/breeze/window-close.svg" width="16" height="16"><div>Close</div></button>
    <button id="context-task-unpin" class="menu-row" data-action="task.menu.unpin"><img class="symbolic-icon" src="assets/breeze/list-remove.svg" width="16" height="16"><div>Unpin</div></button>
    <button id="context-workspace-activate" class="menu-row" data-action="workspace.menu.activate"><img class="symbolic-icon" src="assets/breeze/go-next.svg" width="16" height="16"><div>Activate</div></button>
    <button id="context-workspace-insert-after" class="menu-row" data-action="workspace.menu.insert-after"><img class="symbolic-icon" src="assets/breeze/list-add.svg" width="16" height="16"><div>Insert workspace after</div></button>
    <button id="context-workspace-remove" class="menu-row" data-action="workspace.menu.remove"><img class="symbolic-icon" src="assets/breeze/edit-delete.svg" width="16" height="16"><div>Remove workspace</div></button>
    <button id="context-taskbar-new-desktop" class="menu-row" data-action="taskbar.menu.new-desktop"><img class="symbolic-icon" src="assets/breeze/desktop.svg" width="16" height="16"><div>Add Virtual Desktop</div></button>
    <button id="context-taskbar-settings" class="menu-row" data-action="taskbar.menu.settings"><img class="symbolic-icon" src="assets/breeze/preferences-desktop.svg" width="16" height="16"><div>FlameWM Settings</div></button>
  </section>
</body>
</html>
