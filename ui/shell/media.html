<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>FlameWM media</title>
  <link rel="stylesheet" href="flamewm.css">
</head>
<body class="popup-body">
  <section id="media-popup" class="tray-popup media-popup" data-action="popup.surface">
    <div id="media-title" class="media-title">&#8203;</div>
    <div class="media-controls">
      <button class="media-control" id="media-previous" data-action="media.previous"><img class="symbolic-icon" src="assets/breeze/media-skip-backward.svg"></button>
      <div class="media-control is-disabled" id="media-previous-disabled"><img class="symbolic-icon" src="assets/breeze/media-skip-backward.svg"></div>
      <button class="media-control" id="media-playpause" data-action="media.playpause"><img class="symbolic-icon" id="media-play-icon" src="assets/breeze/media-playback-start.svg"><img class="symbolic-icon" id="media-pause-icon" src="assets/breeze/media-playback-pause.svg"></button>
      <div class="media-control is-disabled" id="media-playpause-disabled"><img class="symbolic-icon" src="assets/breeze/media-playback-start.svg"></div>
      <button class="media-control" id="media-next" data-action="media.next"><img class="symbolic-icon" src="assets/breeze/media-skip-forward.svg"></button>
      <div class="media-control is-disabled" id="media-next-disabled"><img class="symbolic-icon" src="assets/breeze/media-skip-forward.svg"></div>
    </div>
  </section>
</body>
</html>
