<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>FlameWM authentication</title>
  <link rel="stylesheet" href="../base/tokens.css">
  <style>
    :root { --surface:#000000bf; --rim:#ffffff7f; --text:#f1f2f3; --muted:#aeb4bb; --field:#ffffff1f; --field-rim:#ffffff4d; --error:#ff8a80; }
    body { margin:0; background:var(--surface); color:var(--text); font-size:var(--font-md); }
    .polkit-card { box-sizing:border-box; width:100%; padding:var(--space-xl); border:1px solid var(--rim); border-radius:var(--radius-md); background:var(--surface); display:flex; flex-direction:column; gap:var(--space-lg); }
    .polkit-title { margin:0; font-size:var(--font-lg); font-weight:600; }
    .polkit-message { margin:0; color:var(--text); }
    .polkit-details { margin:0; display:flex; flex-direction:column; gap:var(--space-xs); color:var(--muted); font-size:var(--font-sm); }
    .polkit-label { color:var(--muted); font-size:var(--font-sm); }
    .polkit-identity, .polkit-password { box-sizing:border-box; width:100%; height:28px; padding:0px var(--space-md); border:1px solid var(--field-rim); border-radius:var(--radius-sm); background:var(--field); color:var(--text); }
    .polkit-error { min-height:16px; margin:0; color:var(--error); font-size:var(--font-sm); }
    .polkit-actions { display:flex; justify-content:flex-end; gap:var(--space-md); }
    .polkit-button { height:28px; padding:0px var(--space-xl); border:1px solid var(--field-rim); border-radius:var(--radius-sm); background:var(--field); color:var(--text); }
  </style>
</head>
<body>
  <section id="polkit" class="polkit-card" role="dialog" aria-modal="true" aria-labelledby="polkit-title">
    <h1 id="polkit-title" class="polkit-title">Authentication required</h1>
    <p id="polkit-message" class="polkit-message">&#8203;</p>
    <dl id="polkit-details" class="polkit-details">&#8203;</dl>
    <label class="polkit-label" for="polkit-identity">Authenticate as</label>
    <select id="polkit-identity" class="polkit-identity" data-action="polkit.identity">&#8203;</select>
    <label class="polkit-label" for="polkit-password">Password</label>
    <!-- Typed text arrives as X key events on the card, not through this node; it shows only the masked value. -->
    <div id="polkit-password" class="polkit-password" role="textbox" aria-readonly="true" aria-label="Password">&#8203;</div>
    <p id="polkit-error" class="polkit-error" role="alert">&#8203;</p>
    <div class="polkit-actions">
      <button id="polkit-cancel" class="polkit-button" type="button" data-action="polkit.cancel">Cancel</button>
      <button id="polkit-submit" class="polkit-button" type="button" data-action="polkit.submit">Authenticate</button>
    </div>
  </section>
</body>
</html>
