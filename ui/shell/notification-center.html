<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>FlameWM notification center</title>
  <link rel="stylesheet" href="flamewm.css">
  <style>
    body { margin:0px; }
    .tray-popup.notification-center-popup { position:absolute; left:0px; top:0px; width:380px; height:520px; padding:0px; gap:0px; display:flex; flex-direction:column; border-radius:24px; background:var(--surface); }
    .nc-header { position:relative; height:48px; display:flex; flex-direction:row; align-items:center; padding:0px var(--sp-5); gap:10px; }
    .nc-title { flex-grow:1; font-size:var(--fs-lg); font-weight:600; color:var(--text); }
    .nc-clear { height:28px; padding:0px var(--sp-4); display:flex; align-items:center; justify-content:center; background:#ffffff1f; border-width:0px; border-radius:var(--r-pill); font-size:var(--fs-sm); font-weight:600; color:var(--text); }
    .nc-toggles { height:52px; padding:6px var(--sp-5); display:flex; flex-direction:row; align-items:center; gap:10px; }
    .nc-toggle { flex:1; height:36px; display:flex; flex-direction:row; align-items:center; justify-content:space-between; padding:0px var(--sp-4); background:#ffffff14; border-width:0px; border-radius:var(--r-lg); font-size:var(--fs-md); color:var(--text); }
    .nc-toggle-state { font-size:var(--fs-sm); font-weight:600; color:var(--text); }
    .nc-list { position:relative; height:400px; overflow-y:auto; }
    .nc-empty { position:relative; padding:32px var(--sp-5); font-size:var(--fs-md); color:var(--text); }
    .nc-group { position:relative; margin:0px 16px 10px 16px; padding:10px var(--sp-4); background:#ffffff14; border-radius:16px; }
    .nc-group-header { height:24px; display:flex; flex-direction:row; align-items:center; gap:var(--sp-3); }
    .nc-group-app { flex-grow:1; font-size:var(--fs-sm); font-weight:600; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .nc-group-count { font-size:var(--fs-xs); color:var(--text); }
    .nc-group-mute { height:24px; padding:0px 10px; display:flex; align-items:center; justify-content:center; background:#ffffff1f; border-width:0px; border-radius:var(--r-pill); font-size:var(--fs-xs); color:var(--text); }
    .nc-item { position:relative; padding:6px 28px 6px 0px; display:flex; flex-direction:column; gap:var(--sp-1); }
    .nc-item-summary { display:block; font-size:var(--fs-md); font-weight:600; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .nc-item-body { display:block; font-size:var(--fs-sm); color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .nc-item-dismiss { position:absolute; right:-28px; top:6px; width:22px; height:22px; padding:0px; background:transparent; border-width:0px; border-radius:var(--r-pill); }
    .nc-item-dismiss .symbolic-icon { width:14px; height:14px; }
    .nc-item-actions { display:flex; flex-direction:row; align-items:center; gap:6px; }
    .nc-item-action { height:24px; padding:0px 10px; display:flex; align-items:center; justify-content:center; background:#ffffff1f; border-width:0px; border-radius:var(--r-pill); font-size:var(--fs-sm); font-weight:600; color:var(--text); }
  </style>
</head>
