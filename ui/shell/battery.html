<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>FlameWM battery</title>
  <link rel="stylesheet" href="flamewm.css">
  <style>
    body { margin:0px; }
    .tray-popup.battery-popup { position:absolute; left:0px; top:0px; width:300px; height:132px; box-sizing:border-box; padding:0px; gap:0px; display:flex; flex-direction:column; border-radius:8px; background:var(--surface); }
    .battery-icon { position:absolute; left:20px; top:20px; width:32px; height:32px; }
    .battery-percent { position:absolute; left:64px; top:6px; height:52px; font-size:44px; font-weight:400; color:var(--text); }
    .battery-track { position:absolute; left:20px; top:76px; width:260px; height:8px; border-radius:4px; background:#3a3d40; }
    .battery-progress-fill { position:absolute; left:0px; top:0px; width:0px; height:8px; border-radius:4px; background:var(--accent); }
    .battery-state { position:absolute; left:20px; top:92px; width:260px; height:18px; font-size:14px; color:var(--text); }
    .battery-cpu { position:absolute; left:20px; top:112px; width:260px; height:16px; font-size:12px; color:var(--muted); }
  </style>
</head>
<body class="popup-body">
  <section id="battery-popup" class="tray-popup battery-popup" data-action="popup.surface">
    <img class="symbolic-icon battery-icon" id="battery-icon-caution" src="assets/breeze/battery-caution.svg">
    <img class="symbolic-icon battery-icon" id="battery-icon-caution-charging" src="assets/breeze/battery-caution-charging.svg">
    <img class="symbolic-icon battery-icon" id="battery-icon-020" src="assets/breeze/battery-020.svg">
    <img class="symbolic-icon battery-icon" id="battery-icon-020-charging" src="assets/breeze/battery-020-charging.svg">
    <img class="symbolic-icon battery-icon" id="battery-icon-030" src="assets/breeze/battery-030.svg">
    <img class="symbolic-icon battery-icon" id="battery-icon-030-charging" src="assets/breeze/battery-030-charging.svg">
    <img class="symbolic-icon battery-icon" id="battery-icon-040" src="assets/breeze/battery-040.svg">
    <img class="symbolic-icon battery-icon" id="battery-icon-040-charging" src="assets/breeze/battery-040-charging.svg">
    <img class="symbolic-icon battery-icon" id="battery-icon-050" src="assets/breeze/battery-050.svg">
    <img class="symbolic-icon battery-icon" id="battery-icon-050-charging" src="assets/breeze/battery-050-charging.svg">
    <img class="symbolic-icon battery-icon" id="battery-icon-060" src="assets/breeze/battery-060.svg">
    <img class="symbolic-icon battery-icon" id="battery-icon-060-charging" src="assets/breeze/battery-060-charging.svg">
    <img class="symbolic-icon battery-icon" id="battery-icon-070" src="assets/breeze/battery-070.svg">
    <img class="symbolic-icon battery-icon" id="battery-icon-070-charging" src="assets/breeze/battery-070-charging.svg">
    <img class="symbolic-icon battery-icon" id="battery-icon-080" src="assets/breeze/battery-080.svg">
    <img class="symbolic-icon battery-icon" id="battery-icon-080-charging" src="assets/breeze/battery-080-charging.svg">
    <img class="symbolic-icon battery-icon" id="battery-icon-090" src="assets/breeze/battery-090.svg">
    <img class="symbolic-icon battery-icon" id="battery-icon-090-charging" src="assets/breeze/battery-090-charging.svg">
    <img class="symbolic-icon battery-icon" id="battery-icon-100" src="assets/breeze/battery-100.svg">
    <img class="symbolic-icon battery-icon" id="battery-icon-100-charging" src="assets/breeze/battery-100-charging.svg">
    <span id="battery-percent" class="battery-percent">&#8203;</span>
    <div id="battery-progress-track" class="battery-track">
      <div id="battery-progress-fill" class="battery-progress-fill"></div>
    </div>
    <div id="battery-state" class="battery-state">&#8203;</div>
    <div id="battery-cpu" class="battery-cpu">&#8203;</div>
  </section>
</body>
</html>
