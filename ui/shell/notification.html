<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>FlameWM notification</title>
  <link rel="stylesheet" href="flamewm.css">
</head>
<body class="notification-body">
  <button id="notification-card" class="notification-card" data-action="notification.dismiss">
    <span id="notification-app" class="notification-app">&#8203;</span>
    <span id="notification-summary" class="notification-summary">&#8203;</span>
    <span id="notification-body" class="notification-copy">&#8203;</span>
    <span id="notification-progress" class="notification-progress"><span id="notification-progress-fill" class="notification-progress-fill"></span></span>
  </button>
</body>
</html>
