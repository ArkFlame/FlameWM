<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>FlameWM audio</title>
  <link rel="stylesheet" href="flamewm.css">
  <style>
    body { margin:0px; }
    .tray-popup.audio-popup { position:absolute; left:0px; top:0px; width:459px; height:460px; padding:0px; gap:0px; display:flex; flex-direction:column; border-radius:8px; background:var(--surface); }
    .audio-header { position:relative; height:48px; display:flex; flex-direction:row; align-items:center; padding:0px 14px; gap:10px; }
    .audio-back { width:28px; height:28px; background:transparent; border-width:0px; border-radius:6px; }
    .audio-back .symbolic-icon { width:16px; height:16px; }
    .audio-tabs { height:44px; padding:6px 14px 6px 14px; display:flex; flex-direction:row; gap:6px; }
    .audio-tab { position:relative; flex-grow:1; height:32px; background:#26282a; border-width:0px; border-radius:8px; color:var(--text); font-size:13px; }
    .audio-tab-bg { position:absolute; left:0px; top:0px; right:0px; bottom:0px; background:#333436; border-radius:8px; }
    .audio-tab-label { position:relative; }
    .audio-list { position:relative; height:336px; overflow-y:auto; }
    .audio-group { position:relative; width:459px; height:84px; }
    .audio-slot-label { position:absolute; left:58px; top:10px; font-size:13px; font-weight:700; color:var(--text); }
    .audio-row-icon { position:absolute; left:16px; top:30px; width:20px; height:20px; }
    .audio-lane { position:absolute; left:52px; top:31px; width:362px; height:12px; }
    .audio-track { position:absolute; left:6px; top:3px; width:350px; height:6px; background:#42474b; border-radius:3px; }
    .audio-track-fill { position:absolute; left:0px; top:0px; width:0px; height:6px; background:var(--accent); border-radius:3px; }
    .audio-thumb { position:absolute; left:0px; top:0px; width:12px; height:12px; border-radius:6px; background:#ffffff; }
    .audio-row-value { position:absolute; left:414px; top:28px; width:40px; font-size:12px; color:var(--text); }
    .audio-mute { position:absolute; left:58px; top:48px; width:28px; height:28px; padding:0px; background:#333436; border-width:0px; border-radius:6px; }
    .audio-mute .symbolic-icon { position:absolute; left:6px; top:6px; width:16px; height:16px; }
    .audio-separator { position:absolute; left:14px; right:14px; bottom:0px; height:1px; background:#42474b; }
    .audio-empty { position:absolute; left:58px; top:24px; font-size:12px; color:var(--text); }
    .audio-footer { position:relative; height:32px; display:flex; flex-direction:row; align-items:center; padding:0px 14px; }
    .audio-footer-sep { position:absolute; left:14px; right:14px; top:0px; height:1px; background:#42474b; }
    .audio-raise-label { flex-grow:1; font-size:12px; color:var(--text); }
    .audio-raise-track { position:relative; width:39px; height:19px; border-radius:10px; background:#42474b; }
    .audio-raise-knob { position:absolute; left:2px; top:2px; width:15px; height:15px; border-radius:8px; background:#ffffff; }
  </style>
</head>
<body class="popup-body">
  <section id="audio-popup" class="tray-popup audio-popup" data-action="popup.surface">
    <div class="audio-header">
      <button id="audio-back" class="audio-back" data-action="audio.back"><img class="symbolic-icon" src="assets/breeze/go-previous.svg"></button>
      <div class="popup-title">Audio Volume</div>
    </div>
    <div class="audio-tabs">
      <button id="audio-tab-devices" class="audio-tab" data-action="audio.tab.devices"><span id="audio-tab-devices-bg" class="audio-tab-bg"></span><span class="audio-tab-label">Devices</span></button>
      <button id="audio-tab-apps" class="audio-tab" data-action="audio.tab.apps"><span id="audio-tab-apps-bg" class="audio-tab-bg"></span><span class="audio-tab-label">Applications</span></button>
    </div>
    <div id="audio-list" class="audio-list" data-scroll="audio-list">
      <div id="audio-empty" class="audio-empty">&#8203;</div>
      <div id="audio-slot-1" class="audio-group">
        <span id="audio-slot-1-label" class="audio-slot-label">&#8203;</span>
        <img id="audio-slot-1-icon-out" class="symbolic-icon audio-row-icon" src="assets/breeze/audio-volume-high.svg">
        <img id="audio-slot-1-icon-in" class="symbolic-icon audio-row-icon" src="assets/breeze/audio-input-microphone.svg">
        <img id="audio-slot-1-icon-app" class="symbolic-icon audio-row-icon" src="assets/breeze/applications-multimedia.svg">
        <div class="audio-lane" data-action="audio.slot.1.set"><div id="audio-slot-1-track" class="audio-track"><div id="audio-slot-1-fill" class="audio-track-fill"></div></div><div id="audio-slot-1-thumb" class="audio-thumb"></div></div>
        <span id="audio-slot-1-value" class="audio-row-value">&#8203;</span>
        <button id="audio-slot-1-mute" class="audio-mute" data-action="audio.slot.1.mute" aria-label="Mute"><img id="audio-slot-1-mute-icon-off" class="symbolic-icon" src="assets/breeze/audio-volume-high.svg"><img id="audio-slot-1-mute-icon-on" class="symbolic-icon" src="assets/breeze/audio-volume-muted.svg"></button>
        <div class="audio-separator"></div>
      </div>
      <div id="audio-slot-2" class="audio-group">
        <span id="audio-slot-2-label" class="audio-slot-label">&#8203;</span>
        <img id="audio-slot-2-icon-out" class="symbolic-icon audio-row-icon" src="assets/breeze/audio-volume-high.svg">
        <img id="audio-slot-2-icon-in" class="symbolic-icon audio-row-icon" src="assets/breeze/audio-input-microphone.svg">
        <img id="audio-slot-2-icon-app" class="symbolic-icon audio-row-icon" src="assets/breeze/applications-multimedia.svg">
        <div class="audio-lane" data-action="audio.slot.2.set"><div id="audio-slot-2-track" class="audio-track"><div id="audio-slot-2-fill" class="audio-track-fill"></div></div><div id="audio-slot-2-thumb" class="audio-thumb"></div></div>
        <span id="audio-slot-2-value" class="audio-row-value">&#8203;</span>
        <button id="audio-slot-2-mute" class="audio-mute" data-action="audio.slot.2.mute" aria-label="Mute"><img id="audio-slot-2-mute-icon-off" class="symbolic-icon" src="assets/breeze/audio-volume-high.svg"><img id="audio-slot-2-mute-icon-on" class="symbolic-icon" src="assets/breeze/audio-volume-muted.svg"></button>
        <div class="audio-separator"></div>
      </div>
      <div id="audio-slot-3" class="audio-group">
        <span id="audio-slot-3-label" class="audio-slot-label">&#8203;</span>
        <img id="audio-slot-3-icon-out" class="symbolic-icon audio-row-icon" src="assets/breeze/audio-volume-high.svg">
        <img id="audio-slot-3-icon-in" class="symbolic-icon audio-row-icon" src="assets/breeze/audio-input-microphone.svg">
        <img id="audio-slot-3-icon-app" class="symbolic-icon audio-row-icon" src="assets/breeze/applications-multimedia.svg">
        <div class="audio-lane" data-action="audio.slot.3.set"><div id="audio-slot-3-track" class="audio-track"><div id="audio-slot-3-fill" class="audio-track-fill"></div></div><div id="audio-slot-3-thumb" class="audio-thumb"></div></div>
        <span id="audio-slot-3-value" class="audio-row-value">&#8203;</span>
        <button id="audio-slot-3-mute" class="audio-mute" data-action="audio.slot.3.mute" aria-label="Mute"><img id="audio-slot-3-mute-icon-off" class="symbolic-icon" src="assets/breeze/audio-volume-high.svg"><img id="audio-slot-3-mute-icon-on" class="symbolic-icon" src="assets/breeze/audio-volume-muted.svg"></button>
        <div class="audio-separator"></div>
      </div>
      <div id="audio-slot-4" class="audio-group">
        <span id="audio-slot-4-label" class="audio-slot-label">&#8203;</span>
        <img id="audio-slot-4-icon-out" class="symbolic-icon audio-row-icon" src="assets/breeze/audio-volume-high.svg">
        <img id="audio-slot-4-icon-in" class="symbolic-icon audio-row-icon" src="assets/breeze/audio-input-microphone.svg">
        <img id="audio-slot-4-icon-app" class="symbolic-icon audio-row-icon" src="assets/breeze/applications-multimedia.svg">
        <div class="audio-lane" data-action="audio.slot.4.set"><div id="audio-slot-4-track" class="audio-track"><div id="audio-slot-4-fill" class="audio-track-fill"></div></div><div id="audio-slot-4-thumb" class="audio-thumb"></div></div>
        <span id="audio-slot-4-value" class="audio-row-value">&#8203;</span>
        <button id="audio-slot-4-mute" class="audio-mute" data-action="audio.slot.4.mute" aria-label="Mute"><img id="audio-slot-4-mute-icon-off" class="symbolic-icon" src="assets/breeze/audio-volume-high.svg"><img id="audio-slot-4-mute-icon-on" class="symbolic-icon" src="assets/breeze/audio-volume-muted.svg"></button>
        <div class="audio-separator"></div>
      </div>
    </div>
    <div class="audio-footer">
      <div class="audio-footer-sep"></div>
      <span class="audio-raise-label">Raise maximum volume</span>
      <div id="audio-raise-track" class="audio-raise-track" data-action="audio.raise.toggle"><div id="audio-raise-knob" class="audio-raise-knob"></div></div>
    </div>
  </section>
</body>
</html>
