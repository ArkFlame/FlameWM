<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>FlameWM audio</title>
  <link rel="stylesheet" href="flamewm.css">
</head>
<body class="popup-body">
  <section id="audio-popup" class="tray-popup audio-popup" data-action="popup.surface">
    <div class="popup-title">Audio Volume</div>
    <div id="audio-details" class="popup-subtitle">&#8203;</div>
    <div class="volume-line">
      <button id="volume-mute" class="volume-icon-button" data-action="volume.mute"><img class="symbolic-icon" id="popup-volume-icon" src="assets/breeze/audio-volume-high.svg"><img class="symbolic-icon" id="popup-muted-icon" src="assets/breeze/audio-volume-muted.svg"></button>
      <button class="volume-step" data-action="volume.down">-</button>
      <div id="volume-value" class="volume-value">&#8203;</div>
      <button class="volume-step" data-action="volume.up">+</button>
    </div>
    <div class="volume-track"><div id="volume-track-fill" class="volume-track-fill"></div></div>
    <div class="popup-tabs"><button data-action="audio.tab.devices">Devices</button><button data-action="audio.tab.apps">Applications</button><button data-action="audio.raise.toggle">Raise maximum (150%)</button></div><div id="audio-list" class="audio-list" data-scroll="audio-list">
    <div id="audio-slot-1" class="audio-row"><span id="audio-slot-1-label" class="audio-slot-label">&#8203;</span><span id="audio-slot-1-value">&#8203;</span><button data-action="audio.slot.1.down">-</button><button data-action="audio.slot.1.up">+</button><button data-action="audio.slot.1.mute">Mute</button></div>
    <div id="audio-slot-2" class="audio-row"><span id="audio-slot-2-label" class="audio-slot-label">&#8203;</span><span id="audio-slot-2-value">&#8203;</span><button data-action="audio.slot.2.down">-</button><button data-action="audio.slot.2.up">+</button><button data-action="audio.slot.2.mute">Mute</button></div>
    <div id="audio-slot-3" class="audio-row"><span id="audio-slot-3-label" class="audio-slot-label">&#8203;</span><span id="audio-slot-3-value">&#8203;</span><button data-action="audio.slot.3.down">-</button><button data-action="audio.slot.3.up">+</button><button data-action="audio.slot.3.mute">Mute</button></div>
  </div></section>
</body>
</html>
