<!doctype html>
<html><head><meta charset="utf-8"><title>FlameWM launch indicator</title>
<style>html,body{width:100%;height:100%;margin:0;background:transparent;overflow:hidden}
.launch-dot{position:absolute;width:4px;height:4px;border-radius:2px;background:#46505a}
#launch-dot-0{left:6px;top:0px}
#launch-dot-1{left:12px;top:6px}
#launch-dot-2{left:6px;top:12px}
#launch-dot-3{left:0px;top:6px}
#launch-icon{position:absolute;left:0;top:0;width:16px;height:16px;display:none}</style></head>
<body><div id="launch-dot-0" class="launch-dot"></div><div id="launch-dot-1" class="launch-dot"></div><div id="launch-dot-2" class="launch-dot"></div><div id="launch-dot-3" class="launch-dot"></div><img id="launch-icon" src="assets/breeze/applications-utilities.svg" width="16" height="16"></body></html>
