<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>FlameWM panel</title>
  <link rel="stylesheet" href="flamewm.css">
</head>
<body class="panel-body">
  <footer id="taskbar" class="taskbar" data-action="taskbar.surface">
    <div id="start-capsule" class="capsule"><button id="task-start" class="task-button" data-action="start.toggle"><img id="task-start-icon" class="task-start-icon" src="assets/branding/flamewm-start.svg"></button></div>
    <div id="task-slots" class="task-slots">
      <button id="task-slot-1" class="task-slot" data-action="task.slot.1"><img id="task-slot-1-icon" class="task-slot-icon" src="assets/branding/flamewm-start.svg"><span id="task-slot-1-label" class="task-slot-label">&#8203;</span><span id="task-slot-1-line" class="underline"></span><span id="task-slot-1-progress" class="task-progress"></span></button>
      <button id="task-slot-2" class="task-slot" data-action="task.slot.2"><img id="task-slot-2-icon" class="task-slot-icon" src="assets/branding/flamewm-start.svg"><span id="task-slot-2-label" class="task-slot-label">&#8203;</span><span id="task-slot-2-line" class="underline"></span><span id="task-slot-2-progress" class="task-progress"></span></button>
      <button id="task-slot-3" class="task-slot" data-action="task.slot.3"><img id="task-slot-3-icon" class="task-slot-icon" src="assets/branding/flamewm-start.svg"><span id="task-slot-3-label" class="task-slot-label">&#8203;</span><span id="task-slot-3-line" class="underline"></span><span id="task-slot-3-progress" class="task-progress"></span></button>
      <button id="task-slot-4" class="task-slot" data-action="task.slot.4"><img id="task-slot-4-icon" class="task-slot-icon" src="assets/branding/flamewm-start.svg"><span id="task-slot-4-label" class="task-slot-label">&#8203;</span><span id="task-slot-4-line" class="underline"></span><span id="task-slot-4-progress" class="task-progress"></span></button>
      <button id="task-slot-5" class="task-slot" data-action="task.slot.5"><img id="task-slot-5-icon" class="task-slot-icon" src="assets/branding/flamewm-start.svg"><span id="task-slot-5-label" class="task-slot-label">&#8203;</span><span id="task-slot-5-line" class="underline"></span><span id="task-slot-5-progress" class="task-progress"></span></button>
      <button id="task-slot-6" class="task-slot" data-action="task.slot.6"><img id="task-slot-6-icon" class="task-slot-icon" src="assets/branding/flamewm-start.svg"><span id="task-slot-6-label" class="task-slot-label">&#8203;</span><span id="task-slot-6-line" class="underline"></span><span id="task-slot-6-progress" class="task-progress"></span></button>
      <button id="task-slot-7" class="task-slot" data-action="task.slot.7"><img id="task-slot-7-icon" class="task-slot-icon" src="assets/branding/flamewm-start.svg"><span id="task-slot-7-label" class="task-slot-label">&#8203;</span><span id="task-slot-7-line" class="underline"></span><span id="task-slot-7-progress" class="task-progress"></span></button>
      <button id="task-slot-8" class="task-slot" data-action="task.slot.8"><img id="task-slot-8-icon" class="task-slot-icon" src="assets/branding/flamewm-start.svg"><span id="task-slot-8-label" class="task-slot-label">&#8203;</span><span id="task-slot-8-line" class="underline"></span><span id="task-slot-8-progress" class="task-progress"></span></button>
      <div id="task-slot-insert" class="task-slot-insert"></div>
    </div>
    <div id="taskbar-spacer" class="taskbar-spacer"></div>
    <div id="workspace-pager" class="workspace-pager">
      <div id="workspace-column-1" class="workspace-column">
        <button id="workspace-1" class="workspace-button" data-action="workspace.1">1</button>
        <button id="workspace-2" class="workspace-button" data-action="workspace.2">1</button>
      </div>
      <div id="workspace-column-2" class="workspace-column">
        <button id="workspace-3" class="workspace-button" data-action="workspace.3">1</button>
        <button id="workspace-4" class="workspace-button" data-action="workspace.4">1</button>
      </div>
      <div id="workspace-column-3" class="workspace-column">
        <button id="workspace-5" class="workspace-button" data-action="workspace.5">1</button>
        <button id="workspace-6" class="workspace-button" data-action="workspace.6">1</button>
      </div>
      <div id="workspace-column-4" class="workspace-column">
        <button id="workspace-7" class="workspace-button" data-action="workspace.7">1</button>
        <button id="workspace-8" class="workspace-button" data-action="workspace.8">1</button>
      </div>
      <div id="workspace-column-5" class="workspace-column">
        <button id="workspace-9" class="workspace-button" data-action="workspace.9">1</button>
        <button id="workspace-10" class="workspace-button" data-action="workspace.10">1</button>
      </div>
      <div id="workspace-column-6" class="workspace-column">
        <button id="workspace-11" class="workspace-button" data-action="workspace.11">1</button>
        <button id="workspace-12" class="workspace-button" data-action="workspace.12">1</button>
      </div>
      <div id="workspace-column-7" class="workspace-column">
        <button id="workspace-13" class="workspace-button" data-action="workspace.13">1</button>
        <button id="workspace-14" class="workspace-button" data-action="workspace.14">1</button>
      </div>
      <div id="workspace-column-8" class="workspace-column">
        <button id="workspace-15" class="workspace-button" data-action="workspace.15">1</button>
        <button id="workspace-16" class="workspace-button" data-action="workspace.16">1</button>
      </div>
      <div id="workspace-column-9" class="workspace-column">
        <button id="workspace-17" class="workspace-button" data-action="workspace.17">1</button>
        <button id="workspace-18" class="workspace-button" data-action="workspace.18">1</button>
      </div>
    </div>
    <div id="tray-group" class="tray-group">
      <button id="tray-media" class="tray-button" data-action="media.toggle"><img class="symbolic-icon" id="tray-play-icon" src="assets/breeze/media-playback-start.svg"><img class="symbolic-icon" id="tray-pause-icon" src="assets/breeze/media-playback-pause.svg"></button>
      <button id="tray-weather" class="tray-button tray-weather" data-action="weather.open"><img class="symbolic-icon" id="tray-weather-clear" src="assets/breeze/weather-clear.svg"><img class="symbolic-icon" id="tray-weather-few-clouds" src="assets/breeze/weather-few-clouds.svg"><img class="symbolic-icon" id="tray-weather-overcast" src="assets/breeze/weather-overcast.svg"><img class="symbolic-icon" id="tray-weather-fog" src="assets/breeze/weather-fog.svg"><img class="symbolic-icon" id="tray-weather-showers-scattered" src="assets/breeze/weather-showers-scattered.svg"><img class="symbolic-icon" id="tray-weather-showers" src="assets/breeze/weather-showers.svg"><img class="symbolic-icon" id="tray-weather-snow" src="assets/breeze/weather-snow.svg"><img class="symbolic-icon" id="tray-weather-storm" src="assets/breeze/weather-storm.svg"><img class="symbolic-icon" id="tray-weather-none-available" src="assets/breeze/weather-none-available.svg"><span id="tray-weather-temp" class="tray-weather-temp">--</span></button>
      <button id="tray-volume" class="tray-button" data-action="volume.open"><img class="symbolic-icon" id="tray-volume-icon" src="assets/breeze/audio-volume-high.svg"><img class="symbolic-icon" id="tray-volume-muted-icon" src="assets/breeze/audio-volume-muted.svg"></button>
      <button id="tray-network" class="tray-button" data-action="network.open"><img class="symbolic-icon" id="tray-wifi" src="assets/breeze/network-wireless.svg"></button>
      <button id="tray-battery" class="tray-button" data-action="battery.open"><img class="symbolic-icon" id="tray-battery-caution" src="assets/breeze/battery-caution.svg"><img class="symbolic-icon" id="tray-battery-caution-charging" src="assets/breeze/tray-battery-caution-charging.svg"><img class="symbolic-icon" id="tray-battery-020" src="assets/breeze/battery-020.svg"><img class="symbolic-icon" id="tray-battery-020-charging" src="assets/breeze/tray-battery-020-charging.svg"><img class="symbolic-icon" id="tray-battery-030" src="assets/breeze/battery-030.svg"><img class="symbolic-icon" id="tray-battery-030-charging" src="assets/breeze/tray-battery-030-charging.svg"><img class="symbolic-icon" id="tray-battery-040" src="assets/breeze/battery-040.svg"><img class="symbolic-icon" id="tray-battery-040-charging" src="assets/breeze/tray-battery-040-charging.svg"><img class="symbolic-icon" id="tray-battery-050" src="assets/breeze/battery-050.svg"><img class="symbolic-icon" id="tray-battery-050-charging" src="assets/breeze/tray-battery-050-charging.svg"><img class="symbolic-icon" id="tray-battery-060" src="assets/breeze/battery-060.svg"><img class="symbolic-icon" id="tray-battery-060-charging" src="assets/breeze/tray-battery-060-charging.svg"><img class="symbolic-icon" id="tray-battery-070" src="assets/breeze/battery-070.svg"><img class="symbolic-icon" id="tray-battery-070-charging" src="assets/breeze/tray-battery-070-charging.svg"><img class="symbolic-icon" id="tray-battery-080" src="assets/breeze/battery-080.svg"><img class="symbolic-icon" id="tray-battery-080-charging" src="assets/breeze/tray-battery-080-charging.svg"><img class="symbolic-icon" id="tray-battery-090" src="assets/breeze/battery-090.svg"><img class="symbolic-icon" id="tray-battery-090-charging" src="assets/breeze/tray-battery-090-charging.svg"><img class="symbolic-icon" id="tray-battery-100" src="assets/breeze/battery-100.svg"><img class="symbolic-icon" id="tray-battery-100-charging" src="assets/breeze/tray-battery-100-charging.svg"></button>
    </div>
    <div id="clock-capsule" class="capsule"><button id="clock-button" class="clock" data-action="clock.open"><span id="clock-time" class="clock-time">&#8203;</span><span id="clock-date" class="clock-date date">&#8203;</span></button></div>
  </footer>
</body>
</html>
