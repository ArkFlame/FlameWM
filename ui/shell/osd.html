<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>FlameWM volume OSD</title>
  <style>
    :root { --accent:#7f878e; --accent-soft:#7f878e38; --accent-strong:#7f878edd; --desktop-hover:#7f878e26; --desktop-hover-border:#7f878e4d; --desktop-selected:#7f878e47; --desktop-selected-border:#7f878ea6; --selection-fill:#7f878e33; --snap-fill:#7f878e33; }
    body { margin:0; background:transparent; border-radius:18px; }
    .osd-card { position:absolute; left:0px; top:0px; width:215px; height:37px; box-sizing:border-box; background:#1e2123; color:#f1f2f3; border:1px solid #ffffff3f; border-radius:18px; }
    .osd-icon { position:absolute; left:13px; top:10.5px; width:16px; height:16px; }
    .osd-track { position:absolute; left:40px; top:16px; width:129px; height:5px; border-radius:2.5px; background:rgba(255,255,255,0.16); }
    .osd-fill { position:absolute; left:40px; top:16px; width:0px; height:5px; border-radius:2.5px; background:var(--accent); }
    .osd-text { position:absolute; left:150px; top:12px; width:55px; height:13px; display:flex; justify-content:flex-end; font-size:12px; font-weight:600; color:#f1f2f3; white-space:nowrap; }
  </style>
</head>
<body>
  <section id="osd" class="osd-card">
    <img id="osd-icon-high" class="symbolic-icon osd-icon" src="assets/breeze/audio-volume-high.svg">
    <img id="osd-icon-muted" class="symbolic-icon osd-icon" src="assets/breeze/audio-volume-muted.svg">
    <div id="osd-track" class="osd-track"></div>
    <div id="osd-fill" class="osd-fill"></div>
    <div id="osd-text" class="osd-text">&#8203;</div>
  </section>
</body>
</html>
