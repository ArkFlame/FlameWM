<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>FlameWM volume OSD</title>
  <style>
    body { margin:0; background:transparent; }
    .osd-card { position:absolute; left:0px; top:0px; width:430px; height:74px; box-sizing:border-box; background:#34291F; border:1px solid rgba(255,255,255,0.18); border-radius:37px; }
    .osd-icon { position:absolute; left:26px; top:21px; width:32px; height:32px; }
    .osd-track { position:absolute; left:80px; top:32.5px; width:258px; height:9px; border-radius:5px; background:#241C16; }
    .osd-fill { position:absolute; left:80px; top:32.5px; width:0px; height:9px; border-radius:5px; background:#A84731; }
    .osd-text { position:absolute; left:300px; top:24px; width:110px; height:26px; display:flex; justify-content:flex-end; font-size:23px; font-weight:600; color:#ffffff; white-space:nowrap; }
  </style>
</head>
<body>
  <section id="osd" class="osd-card">
    <img id="osd-icon-high" class="symbolic-icon osd-icon" src="assets/breeze/audio-volume-high.svg">
    <img id="osd-icon-muted" class="symbolic-icon osd-icon" src="assets/breeze/audio-volume-muted.svg">
    <div id="osd-track" class="osd-track"></div>
    <div id="osd-fill" class="osd-fill"></div>
    <div id="osd-text" class="osd-text">&#8203;</div>
  </section>
</body>
</html>
