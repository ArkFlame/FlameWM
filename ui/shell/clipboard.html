<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>FlameWM Clipboard History</title>
  <link rel="stylesheet" href="../base/tokens.css">
  <link rel="stylesheet" href="flamewm.css">
</head>
<body class="popup-body">
  <section id="clipboard-popup" class="launcher-popup" data-action="clipboard.surface">
    <div id="clipboard-title" class="launcher-query">Clipboard history</div>
    <div id="clipboard-list" class="launcher-list" role="listbox" aria-label="Clipboard history">
      <div id="clipboard-highlight" class="launcher-highlight"></div>
      <div id="clipboard-row-1" class="launcher-row" role="option" aria-selected="false"><div id="clipboard-row-1-label" class="launcher-label">&#8203;</div></div>
      <div id="clipboard-row-2" class="launcher-row" role="option" aria-selected="false"><div id="clipboard-row-2-label" class="launcher-label">&#8203;</div></div>
      <div id="clipboard-row-3" class="launcher-row" role="option" aria-selected="false"><div id="clipboard-row-3-label" class="launcher-label">&#8203;</div></div>
      <div id="clipboard-row-4" class="launcher-row" role="option" aria-selected="false"><div id="clipboard-row-4-label" class="launcher-label">&#8203;</div></div>
      <div id="clipboard-row-5" class="launcher-row" role="option" aria-selected="false"><div id="clipboard-row-5-label" class="launcher-label">&#8203;</div></div>
      <div id="clipboard-row-6" class="launcher-row" role="option" aria-selected="false"><div id="clipboard-row-6-label" class="launcher-label">&#8203;</div></div>
      <div id="clipboard-row-7" class="launcher-row" role="option" aria-selected="false"><div id="clipboard-row-7-label" class="launcher-label">&#8203;</div></div>
      <div id="clipboard-row-8" class="launcher-row" role="option" aria-selected="false"><div id="clipboard-row-8-label" class="launcher-label">&#8203;</div></div>
      <div id="clipboard-empty" class="launcher-empty">No clipboard history</div>
    </div>
  </section>
</body>
</html>
