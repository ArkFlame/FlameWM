<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>FlameWM dock label</title>
  <style>
    body { margin:0; background:transparent; }
    .dock-tip { position:absolute; left:0px; top:0px; width:160px; height:22px; box-sizing:border-box; display:flex; align-items:center; justify-content:center; background:#1e2123; color:#f1f2f3; border:1px solid #ffffff7f; border-radius:11px; font-size:12px; white-space:nowrap; overflow:hidden; }
  </style>
</head>
<body>
  <section id="dock-tip" class="dock-tip"><span id="dock-tip-text">&#8203;</span></section>
</body>
</html>
