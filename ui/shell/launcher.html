<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>FlameWM Launcher</title>
  <link rel="stylesheet" href="flamewm.css">
</head>
<body class="popup-body">
  <section id="launcher-popup" class="launcher-popup" data-action="launcher.surface">
    <div id="launcher-search" class="start-search-field launcher-search">
      <img class="symbolic-icon" src="assets/breeze/edit-find.svg">
      <div id="launcher-query-label" class="launcher-query">Search...</div>
    </div>
    <div id="launcher-list" class="launcher-list">
      <div id="launcher-highlight" class="launcher-highlight"></div>
      <button id="launcher-row-1" class="launcher-row" data-action="launcher.app.1"><img id="launcher-row-1-icon" src="assets/breeze/edit-find.svg"><div id="launcher-row-1-label" class="launcher-label">&#8203;</div></button>
      <button id="launcher-row-2" class="launcher-row" data-action="launcher.app.2"><img id="launcher-row-2-icon" src="assets/breeze/edit-find.svg"><div id="launcher-row-2-label" class="launcher-label">&#8203;</div></button>
      <button id="launcher-row-3" class="launcher-row" data-action="launcher.app.3"><img id="launcher-row-3-icon" src="assets/breeze/edit-find.svg"><div id="launcher-row-3-label" class="launcher-label">&#8203;</div></button>
      <button id="launcher-row-4" class="launcher-row" data-action="launcher.app.4"><img id="launcher-row-4-icon" src="assets/breeze/edit-find.svg"><div id="launcher-row-4-label" class="launcher-label">&#8203;</div></button>
      <button id="launcher-row-5" class="launcher-row" data-action="launcher.app.5"><img id="launcher-row-5-icon" src="assets/breeze/edit-find.svg"><div id="launcher-row-5-label" class="launcher-label">&#8203;</div></button>
      <button id="launcher-row-6" class="launcher-row" data-action="launcher.app.6"><img id="launcher-row-6-icon" src="assets/breeze/edit-find.svg"><div id="launcher-row-6-label" class="launcher-label">&#8203;</div></button>
      <button id="launcher-row-7" class="launcher-row" data-action="launcher.app.7"><img id="launcher-row-7-icon" src="assets/breeze/edit-find.svg"><div id="launcher-row-7-label" class="launcher-label">&#8203;</div></button>
      <button id="launcher-row-8" class="launcher-row" data-action="launcher.app.8"><img id="launcher-row-8-icon" src="assets/breeze/edit-find.svg"><div id="launcher-row-8-label" class="launcher-label">&#8203;</div></button>
      <div id="launcher-empty" class="launcher-empty">No matching applications</div>
    </div>
  </section>
</body>
</html>
