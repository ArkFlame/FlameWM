<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>FlameWM Start</title>
  <link rel="stylesheet" href="flamewm.css">
</head>
<body class="popup-body">
  <section id="start-menu" class="start-menu" data-action="start.menu.surface">
    <div id="start-left-pane" class="start-left-pane">
      <div id="start-categories" class="start-categories">
        <button id="start-category-development" class="start-category" data-action="start.category.development"><img src="assets/breeze/applications-development.svg"><div>Development</div></button>
        <button id="start-category-games" class="start-category" data-action="start.category.games"><img src="assets/breeze/applications-games.svg"><div>Games</div></button>
        <button id="start-category-graphics" class="start-category" data-action="start.category.graphics"><img src="assets/breeze/applications-graphics.svg"><div>Graphics</div></button>
        <button id="start-category-internet" class="start-category" data-action="start.category.internet"><img src="assets/breeze/applications-internet.svg"><div>Internet</div></button>
        <button id="start-category-multimedia" class="start-category" data-action="start.category.multimedia"><img src="assets/breeze/applications-multimedia.svg"><div>Multimedia</div></button>
        <button id="start-category-system" class="start-category" data-action="start.category.system"><img src="assets/breeze/applications-system.svg"><div>System</div></button>
        <button id="start-category-utilities" class="start-category" data-action="start.category.utilities"><img src="assets/breeze/applications-utilities.svg"><div>Utilities</div></button>
        <button id="start-category-power" class="start-category" data-action="start.category.power"><img class="symbolic-icon" src="assets/breeze/system-shutdown.svg"><div>Power / Session</div></button>
      </div>
      <button id="start-search-field" class="start-search" data-action="start.search"><div id="start-search-box" class="start-search-field"><img class="symbolic-icon" src="assets/breeze/edit-find.svg"><div id="start-search-label">Search applications</div></div></button>
    </div>
    <div id="start-content-pane" class="start-content-pane">
      <div id="start-list" class="start-list" data-scroll="start-list"><div id="start-applications" class="start-group">
        <button id="start-app-slot-1" class="start-app" data-action="start.app.1"><img id="start-app-slot-1-icon" src="assets/breeze/edit-find.svg"><div id="start-app-slot-1-label">&#8203;</div></button>
        <button id="start-app-slot-2" class="start-app" data-action="start.app.2"><img id="start-app-slot-2-icon" src="assets/breeze/edit-find.svg"><div id="start-app-slot-2-label">&#8203;</div></button>
        <button id="start-app-slot-3" class="start-app" data-action="start.app.3"><img id="start-app-slot-3-icon" src="assets/breeze/edit-find.svg"><div id="start-app-slot-3-label">&#8203;</div></button>
        <button id="start-app-slot-4" class="start-app" data-action="start.app.4"><img id="start-app-slot-4-icon" src="assets/breeze/edit-find.svg"><div id="start-app-slot-4-label">&#8203;</div></button>
        <button id="start-app-slot-5" class="start-app" data-action="start.app.5"><img id="start-app-slot-5-icon" src="assets/breeze/edit-find.svg"><div id="start-app-slot-5-label">&#8203;</div></button>
        <button id="start-app-slot-6" class="start-app" data-action="start.app.6"><img id="start-app-slot-6-icon" src="assets/breeze/edit-find.svg"><div id="start-app-slot-6-label">&#8203;</div></button>
        <button id="start-app-slot-7" class="start-app" data-action="start.app.7"><img id="start-app-slot-7-icon" src="assets/breeze/edit-find.svg"><div id="start-app-slot-7-label">&#8203;</div></button>
        <button id="start-app-slot-8" class="start-app" data-action="start.app.8"><img id="start-app-slot-8-icon" src="assets/breeze/edit-find.svg"><div id="start-app-slot-8-label">&#8203;</div></button>
      </div></div>
      <div id="start-group-power" class="start-group">
        <button id="start-session-lock" class="start-app" data-action="session.lock"><img class="symbolic-icon" src="assets/breeze/system-lock-screen.svg"><div>Lock Screen</div></button>
        <button id="start-session-logout" class="start-app" data-action="session.logout"><img class="symbolic-icon" src="assets/breeze/system-log-out.svg"><div>Log Out</div></button>
        <button id="start-session-suspend" class="start-app" data-action="session.suspend"><img class="symbolic-icon" src="assets/breeze/system-shutdown.svg"><div>Suspend</div></button>
        <button id="start-session-reboot" class="start-app" data-action="session.reboot"><img class="symbolic-icon" src="assets/breeze/system-reboot.svg"><div>Restart</div></button>
        <button id="start-session-shutdown" class="start-app" data-action="session.shutdown"><img class="symbolic-icon" src="assets/breeze/system-shutdown.svg"><div>Shut Down</div></button>
      </div>
      <div id="start-status-label" class="start-status">&#8203;</div>
    </div>
  </section>
</body>
</html>
