    .weather-location { position:absolute; left:20px; top:12px; width:260px; height:18px; font-size:13px; color:var(--text); white-space:nowrap; overflow:hidden; }
    .weather-icon { position:absolute; left:20px; top:36px; width:56px; height:56px; }
    .weather-temp { position:absolute; left:96px; top:34px; width:180px; height:52px; font-size:44px; font-weight:400; color:var(--text); white-space:nowrap; overflow:hidden; }
    .weather-condition { position:absolute; left:96px; top:88px; width:180px; height:18px; font-size:14px; color:var(--text); white-space:nowrap; overflow:hidden; }
    .weather-state { position:absolute; left:20px; top:112px; width:260px; height:16px; font-size:12px; color:var(--accent); white-space:nowrap; overflow:hidden; }
    .weather-day-name { position:absolute; left:20px; width:60px; height:18px; font-size:12px; color:var(--text); }
    .weather-day-icon { position:absolute; left:100px; width:18px; height:18px; }
    .weather-day-range { position:absolute; left:132px; width:148px; height:18px; font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; }
    .weather-attribution { position:absolute; left:20px; top:298px; width:260px; height:14px; font-size:10px; color:var(--muted); white-space:nowrap; overflow:hidden; }
    .weather-row-1 { top:136px; }
    .weather-row-2 { top:158px; }
    .weather-row-3 { top:180px; }
    .weather-row-4 { top:202px; }
    .weather-row-5 { top:224px; }
    .weather-row-6 { top:246px; }
    .weather-row-7 { top:268px; }
  </style>
