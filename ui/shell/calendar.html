<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>FlameWM calendar</title>
  <link rel="stylesheet" href="flamewm.css">
  <style>
    #clock-popup.clock-popup { box-sizing: border-box; width: 580px; height: 476px; padding: 17px; display: flex; flex-direction: column; }
    #clock-popup .calendar-head { height: 40px; display: flex; align-items: center; justify-content: space-between; }
    #clock-popup .popup-title { font-size: 14px; font-weight: 700; }
    #clock-popup .calendar-tabs { height: 34px; display: flex; gap: 4px; }
    #clock-popup .calendar-tab { flex: 1; height: 34px; display: flex; align-items: center; justify-content: center; border-radius: 6px; font-size: 14px; font-weight: 700; color: #f0f0f0; }
    #clock-popup .calendar-nav { height: 34px; display: flex; align-items: center; justify-content: center; gap: 24px; font-size: 14px; font-weight: 700; color: #f0f0f0; }
    #clock-popup .calendar-week { height: 28px; display: flex; }
    #clock-popup .calendar-week div { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: #aab0b5; }
    #clock-popup .calendar-days { height: 306px; display: flex; flex-direction: column; }
    #clock-popup .calendar-row { height: 51px; display: flex; }
    #clock-popup .calendar-day { flex: 1; display: flex; align-items: center; justify-content: center; border-radius: 8px; }
    #clock-popup .calendar-day-marker { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 18px; font-size: 14px; font-weight: 700; }
    #clock-popup .calendar-months, #clock-popup .calendar-years { height: 306px; display: flex; flex-direction: column; }
    #clock-popup .calendar-prow { height: 102px; display: flex; }
    #clock-popup .calendar-pick { flex: 1; height: 102px; display: flex; align-items: center; justify-content: center; border-radius: 8px; font-size: 14px; font-weight: 700; }
  </style>
</head>
