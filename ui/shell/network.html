<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>FlameWM network</title>
  <link rel="stylesheet" href="flamewm.css">
  <style>
    #wifi-popup.network-popup { width:461px; height:453px; box-sizing:border-box; padding:14px; gap:8px; background:var(--surface); border:1px solid #ffffff1f; border-radius:24px; overflow:hidden; }
    .network-header { width:100%; height:32px; display:flex; align-items:center; justify-content:space-between; }
    .network-title { font-size:17px; font-weight:700; color:#f1f2f3; }
    .network-controls { width:100%; height:30px; display:flex; align-items:center; gap:8px; }
    .network-search { width:153px; height:30px; display:flex; align-items:center; gap:6px; }
    .network-search-box { position:relative; flex-grow:1; height:30px; box-sizing:border-box; background:#1b1d20; border:1px solid #353638; border-radius:4px; overflow:hidden; }
    .network-search-box input { position:absolute; left:0px; top:0px; width:100%; height:100%; box-sizing:border-box; background:transparent; color:transparent; border:0px solid #00000000; padding:0px 8px; }
    .network-filter-value { position:absolute; left:8px; top:0px; right:8px; height:100%; display:flex; align-items:center; color:#f1f2f3; }
    .network-filter-placeholder { position:absolute; left:8px; top:0px; right:8px; height:100%; display:flex; align-items:center; color:#aeb4bb; }
    .network-group-title { width:100%; height:22px; color:#aeb4bb; font-size:13px; font-weight:600; }
    .network-connected-row { width:100%; height:48px; box-sizing:border-box; display:flex; align-items:center; gap:10px; padding:0px 8px; background:#ffffff14; border-radius:16px; }
    .network-row { width:100%; height:48px; box-sizing:border-box; display:flex; align-items:center; gap:10px; padding:0px 8px; background:transparent; color:#f1f2f3; border-radius:16px; cursor:default; }
    .network-row:hover { background:#ffffff14; }
    .network-tile { width:30px; height:30px; padding:6px; box-sizing:border-box; border-radius:999px; background:#ffffff24; }
    .network-text { flex-grow:1; display:flex; flex-direction:column; justify-content:center; }
    .network-name { font-size:14px; font-weight:500; color:#f1f2f3; }
    .network-status { font-size:11px; color:#aeb4bb; }
    .network-action { height:24px; padding:0px 10px; border:0px solid #00000000; border-radius:999px; color:#f1f2f3; background:#ffffff24; }
    .network-connect { font-size:11px; color:var(--accent); }
    .network-chevron { width:12px; height:12px; }
    .network-slots { width:100%; max-height:200px; display:flex; flex-direction:column; gap:2px; overflow-y:auto; }
    #network-secret { width:100%; display:flex; flex-direction:column; gap:4px; }
    .network-secret-row { width:100%; height:30px; display:flex; flex-direction:row; align-items:center; gap:6px; }
    #network-secret-box { position:relative; flex-grow:1; min-width:0; height:30px; box-sizing:border-box; background:#1b1d20; border:1px solid #353638; border-radius:4px; overflow:hidden; }
    #network-secret-value { position:absolute; left:8px; top:0px; right:8px; height:100%; display:flex; align-items:center; color:#f1f2f3; overflow:hidden; }
    #network-secret-input { position:absolute; left:0px; top:0px; width:100%; height:100%; box-sizing:border-box; background:transparent; color:transparent; border:0px solid #00000000; padding:0px 8px; }
    #network-secret-error { width:100%; height:16px; overflow:hidden; font-size:11px; color:#e8a0a0; }
    #network-wifi-toggle { width:120px; height:30px; display:flex; flex-direction:row; align-items:center; gap:6px; padding:0px 8px; background:transparent; border:0px solid #00000000; color:#f1f2f3; }
    .network-wifi-track { position:relative; width:44px; height:24px; border-radius:999px; background:#42474b; }
    .network-wifi-knob { position:absolute; left:3px; top:3px; width:18px; height:18px; border-radius:999px; background:#ffffff; }
  </style>
</head>
<body class="popup-body">
  <section id="wifi-popup" class="tray-popup wifi-popup network-popup" data-action="popup.surface">
    <div class="network-header"><div class="network-title">Networks</div><button id="network-scan" data-action="network.scan">Scan</button></div>
    <div class="network-controls"><button id="network-wifi-toggle" data-action="network.wifi.toggle"><img class="symbolic-icon" src="assets/breeze/network-wireless.svg">Wi-Fi<div id="network-wifi-track" class="network-wifi-track"><div id="network-wifi-knob" class="network-wifi-knob"></div></div></button><div class="network-search"><label id="network-filter-label" for="network-filter">Filter</label><div class="network-search-box"><div id="network-filter-placeholder" class="network-filter-placeholder">Filter networks</div><div id="network-filter-value" class="network-filter-value">&#8203;</div><input id="network-filter" type="text" aria-label="Filter networks" data-action="network.filter.focus"></div></div></div>
    <div class="popup-subtitle">Connected to <span id="wifi-connected-name">&#8203;</span></div>
    <div class="network-group-title">Connected</div>
    <div id="network-connected-row" class="network-connected-row"><img id="network-connected-tile" class="symbolic-icon network-tile" src="assets/breeze/network-wireless.svg"><div class="network-text"><div id="network-connected" class="network-name">&#8203;</div><div id="network-connected-status" class="network-status">&#8203;</div></div><button id="network-disconnect" class="network-action" data-action="network.disconnect">Disconnect</button><img class="symbolic-icon network-chevron" src="assets/breeze/go-next.svg"></div>
    <div class="network-group-title">Available</div>
    <div id="network-slots" class="network-slots" data-scroll="network-slots">
      <button id="network-slot-1" class="network-row" data-action="network.connect.1"><img class="symbolic-icon network-tile" src="assets/breeze/network-wireless.svg"><div class="network-text"><div id="network-slot-1-name" class="network-name">&#8203;</div><div id="network-slot-1-status" class="network-status">&#8203;</div></div><span class="network-connect">Connect</span><img class="symbolic-icon" src="assets/breeze/network-wired.svg"><img class="symbolic-icon network-chevron" src="assets/breeze/go-next.svg"></button>
      <button id="network-slot-2" class="network-row" data-action="network.connect.2"><img class="symbolic-icon network-tile" src="assets/breeze/network-wireless.svg"><div class="network-text"><div id="network-slot-2-name" class="network-name">&#8203;</div><div id="network-slot-2-status" class="network-status">&#8203;</div></div><span class="network-connect">Connect</span><img class="symbolic-icon" src="assets/breeze/network-wired.svg"><img class="symbolic-icon network-chevron" src="assets/breeze/go-next.svg"></button>
      <button id="network-slot-3" class="network-row" data-action="network.connect.3"><img class="symbolic-icon network-tile" src="assets/breeze/network-wireless.svg"><div class="network-text"><div id="network-slot-3-name" class="network-name">&#8203;</div><div id="network-slot-3-status" class="network-status">&#8203;</div></div><span class="network-connect">Connect</span><img class="symbolic-icon" src="assets/breeze/network-wired.svg"><img class="symbolic-icon network-chevron" src="assets/breeze/go-next.svg"></button>
      <button id="network-slot-4" class="network-row" data-action="network.connect.4"><img class="symbolic-icon network-tile" src="assets/breeze/network-wireless.svg"><div class="network-text"><div id="network-slot-4-name" class="network-name">&#8203;</div><div id="network-slot-4-status" class="network-status">&#8203;</div></div><span class="network-connect">Connect</span><img class="symbolic-icon" src="assets/breeze/network-wired.svg"><img class="symbolic-icon network-chevron" src="assets/breeze/go-next.svg"></button>
      <button id="network-slot-5" class="network-row" data-action="network.connect.5"><img class="symbolic-icon network-tile" src="assets/breeze/network-wireless.svg"><div class="network-text"><div id="network-slot-5-name" class="network-name">&#8203;</div><div id="network-slot-5-status" class="network-status">&#8203;</div></div><span class="network-connect">Connect</span><img class="symbolic-icon" src="assets/breeze/network-wired.svg"><img class="symbolic-icon network-chevron" src="assets/breeze/go-next.svg"></button>
      <button id="network-slot-6" class="network-row" data-action="network.connect.6"><img class="symbolic-icon network-tile" src="assets/breeze/network-wireless.svg"><div class="network-text"><div id="network-slot-6-name" class="network-name">&#8203;</div><div id="network-slot-6-status" class="network-status">&#8203;</div></div><span class="network-connect">Connect</span><img class="symbolic-icon" src="assets/breeze/network-wired.svg"><img class="symbolic-icon network-chevron" src="assets/breeze/go-next.svg"></button>
      <button id="network-slot-7" class="network-row" data-action="network.connect.7"><img class="symbolic-icon network-tile" src="assets/breeze/network-wireless.svg"><div class="network-text"><div id="network-slot-7-name" class="network-name">&#8203;</div><div id="network-slot-7-status" class="network-status">&#8203;</div></div><span class="network-connect">Connect</span><img class="symbolic-icon" src="assets/breeze/network-wired.svg"><img class="symbolic-icon network-chevron" src="assets/breeze/go-next.svg"></button>
      <button id="network-slot-8" class="network-row" data-action="network.connect.8"><img class="symbolic-icon network-tile" src="assets/breeze/network-wireless.svg"><div class="network-text"><div id="network-slot-8-name" class="network-name">&#8203;</div><div id="network-slot-8-status" class="network-status">&#8203;</div></div><span class="network-connect">Connect</span><img class="symbolic-icon" src="assets/breeze/network-wired.svg"><img class="symbolic-icon network-chevron" src="assets/breeze/go-next.svg"></button>
    </div>
    <div id="network-secret" class="network-secret"><div class="network-secret-row"><label for="network-secret-input">Network password</label><div id="network-secret-box" class="network-secret-box"><div id="network-secret-value" class="network-secret-value">&#8203;</div><input id="network-secret-input" type="password" autocomplete="new-password" aria-label="Network password" data-action="network.secret.focus"></div><button data-action="network.secret.submit">Connect</button><button data-action="network.secret.cancel">Cancel</button></div><div id="network-secret-error" role="status" aria-live="polite">&#8203;</div></div>
  </section>
</body>
</html>
