<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>FlameWM lock</title>
  <link rel="stylesheet" href="lock.css">
</head>
<body class="lock-body">
  <section id="lock-root" class="lock-root">
    <img id="lock-bg" class="lock-abs" src="assets/blank.svg" alt="">
    <div id="lock-clock" class="lock-abs lock-clock">&#8203;</div>
    <div id="lock-date" class="lock-abs lock-date">&#8203;</div>
    <img id="lock-avatar" class="lock-abs" src="assets/blank.svg" alt="">
    <div id="lock-avatar-initial" class="lock-abs lock-avatar-initial">&#8203;</div>
    <div id="lock-username" class="lock-abs lock-username">&#8203;</div>
    <div id="lock-field-shade" class="lock-abs lock-field-shade"></div>
    <div id="lock-field" class="lock-abs lock-field"></div>
    <div id="lock-dots" class="lock-abs lock-dots">&#8203;</div>
    <div id="lock-caret" class="lock-abs lock-caret"></div>
    <div id="lock-submit" class="lock-abs lock-submit">&#8203;</div>
    <div id="lock-submit-glyph" class="lock-abs lock-submit-glyph">&#8250;</div>
    <div id="lock-message" class="lock-abs lock-message">&#8203;</div>
    <img id="lock-power-0" class="lock-abs" src="assets/blank.svg" alt="" data-action="lock.power.0">
    <div id="lock-power-label-0" class="lock-abs lock-power-label">&#8203;</div>
    <img id="lock-power-1" class="lock-abs" src="assets/blank.svg" alt="" data-action="lock.power.1">
    <div id="lock-power-label-1" class="lock-abs lock-power-label">&#8203;</div>
    <img id="lock-power-2" class="lock-abs" src="assets/blank.svg" alt="" data-action="lock.power.2">
    <div id="lock-power-label-2" class="lock-abs lock-power-label">&#8203;</div>
    <img id="lock-power-3" class="lock-abs" src="assets/blank.svg" alt="" data-action="lock.power.3">
    <div id="lock-power-label-3" class="lock-abs lock-power-label">&#8203;</div>
    <div id="lock-power-message" class="lock-abs lock-message">&#8203;</div>
    <div id="lock-confirm" class="lock-abs lock-strip"></div>
    <div id="lock-confirm-text" class="lock-abs lock-strip-text">&#8203;</div>
    <div id="lock-confirm-ok" class="lock-abs lock-action" data-action="lock.confirm">&#8203;</div>
    <div id="lock-confirm-cancel" class="lock-abs lock-action" data-action="lock.cancel">&#8203;</div>
    <div id="lock-other" class="lock-abs lock-strip"></div>
    <div id="lock-other-logout" class="lock-abs lock-action" data-action="lock.logout">&#8203;</div>
    <div id="lock-other-cancel" class="lock-abs lock-action" data-action="lock.cancel">&#8203;</div>
    <div id="lock-footer" class="lock-abs lock-footer">&#8203;</div>
  </section>
</body>
</html>
