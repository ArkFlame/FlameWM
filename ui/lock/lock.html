<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>FlameWM lock</title>
  <link rel="stylesheet" href="lock.css">
</head>
<body class="lock-body">
  <section id="lock-root" class="lock-root">
    <img id="lock-background" class="lock-background" src="assets/blank.svg" alt="">
    <div id="lock-panel" class="lock-panel">
      <div id="lock-clock" class="lock-clock">--:--</div>
      <div id="lock-date" class="lock-date">&#8203;</div>
      <div id="lock-avatar" class="lock-avatar"><div id="lock-avatar-initial" class="lock-avatar-initial">&#8203;</div></div>
      <div id="lock-username" class="lock-username">&#8203;</div>
      <div id="lock-field" class="lock-field"><div id="lock-dots" class="lock-dots">&#8203;</div></div>
      <div id="lock-status" class="lock-status">&#8203;</div>
    </div>
  </section>
</body>
</html>
