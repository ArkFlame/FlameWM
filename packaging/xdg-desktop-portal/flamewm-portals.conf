# FlameWM portal selection. Use KDE's OpenURI and FileChooser where installed;
# GTK is a deliberate fallback for systems without the KDE backend.
[preferred]
default=gtk
org.freedesktop.impl.portal.OpenURI=kde;gtk
org.freedesktop.impl.portal.FileChooser=kde;gtk
# Reuse the existing KDE wallet (ksecretd) for the Secret portal so Chromium
# derivatives that use the portal OSCrypt path see the same wallet as Plasma.
org.freedesktop.impl.portal.Secret=kwallet
