name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Static guards run first: stdlib-only Python, no native deps or toolchain
      # needed, so an architecture-boundary breach fails before the expensive
      # Cargo jobs even start.
      - name: Architecture boundary guard
        run: |
          python3 -I tools/architecture_guard.py
          python3 -I -m unittest discover -s tools -p 'test_architecture_guard.py' -q
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libdbus-1-dev libpulse-dev \
            libx11-dev libxi-dev libxft-dev libxkbcommon-dev libinput-dev libgbm-dev libdrm-dev libudev-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
