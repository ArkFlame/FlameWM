name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the workspace version
        id: version
        run: |
          version="$(./scripts/version)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match workspace version ${version}"
            exit 1
          fi
          echo "version=${version}" >>"$GITHUB_OUTPUT"

  arch:
    needs: version
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - name: Install packaging tools
        run: |
          sed -i '/^NoExtract/d' /etc/pacman.conf
          pacman -Syu --noconfirm --needed git namcap
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build the Arch package
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chown -R builder: "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          sudo -u builder -H ./scripts/build-arch --syncdeps --noconfirm
          mkdir -p dist
          find .target/arch/packages -name 'flamewm-git-[0-9]*.pkg.tar.zst' ! -name '*-debug-*' -exec cp {} dist/ \;
          test -n "$(ls dist)"
      - uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: dist/

  deb:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config python3 dpkg-dev \
            libdbus-1-dev libpulse-dev libx11-dev libxi-dev libxft-dev libxkbcommon-dev \
            libinput-dev libgbm-dev libdrm-dev libudev-dev xwayland
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Build the Debian package
        run: ./scripts/build-deb
      - uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: .target/dist/*.deb

  release:
    needs: [version, arch, deb]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum -- * >SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "FlameWM ${{ needs.version.outputs.version }}" --generate-notes -- *

  aur:
    needs: release
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Skip without an AUR key
        if: env.AUR_SSH_PRIVATE_KEY == ''
        run: echo "::notice::AUR_SSH_PRIVATE_KEY is not set; the AUR package was not updated."
      - name: Install tools
        if: env.AUR_SSH_PRIVATE_KEY != ''
        run: pacman -Syu --noconfirm --needed git openssh
      - uses: actions/checkout@v4
        if: env.AUR_SSH_PRIVATE_KEY != ''
      - name: Push PKGBUILD and .SRCINFO to the AUR
        if: env.AUR_SSH_PRIVATE_KEY != ''
        run: |
          install -dm0700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" >~/.ssh/aur
          chmod 0600 ~/.ssh/aur
          ssh-keyscan -t ed25519 aur.archlinux.org >>~/.ssh/known_hosts
          export GIT_SSH_COMMAND='ssh -i ~/.ssh/aur -o IdentitiesOnly=yes'
          git clone ssh://aur@aur.archlinux.org/flamewm-git.git aur
          cp packaging/arch/PKGBUILD aur/PKGBUILD
          useradd -m builder
          chown -R builder: aur
          (cd aur && sudo -u builder makepkg --printsrcinfo >.SRCINFO)
          cd aur
          git config user.name "${{ vars.AUR_GIT_NAME || 'FlameWM release' }}"
          git config user.email "${{ vars.AUR_GIT_EMAIL || 'maintainers@arkflame.dev' }}"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "AUR package already up to date"
          else
            git commit -m "Update to ${GITHUB_REF_NAME}"
            git push origin HEAD:master
          fi
