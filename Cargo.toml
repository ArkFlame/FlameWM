[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.9"
edition = "2024"
rust-version = "1.85"
license = "LGPL-2.0-only"
repository = "https://github.com/arkflame/flamewm"
authors = ["ArkFlame Studios"]

[workspace.dependencies]
calloop = "=0.14.4"
inotify = { version = "=0.11.4", default-features = false }
rustix = { version = "=1.1.4", default-features = false, features = ["fs", "std", "time"] }
x11rb = { version = "=0.14.0", default-features = false, features = ["randr", "shape", "xkb"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.release.package.flamewm-render-compiler]
opt-level = 2

[profile.release.build-override]
opt-level = 2

[profile.fast]
inherits = "release"
lto = false
codegen-units = 16

[profile.dev]
debug = "line-tables-only"

[profile.dev.build-override]
opt-level = 2

[profile.dev.package."*"]
debug = 0
