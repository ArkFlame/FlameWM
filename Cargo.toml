[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.88"
license = "LGPL-2.0-only"
repository = "https://github.com/arkflame/flamewm"
authors = ["ArkFlame Studios"]

[workspace.dependencies]
calloop = "=0.14.4"
inotify = { version = "=0.11.4", default-features = false }
rustix = { version = "=1.1.4", default-features = false, features = ["fs", "std", "time"] }
x11rb = { version = "=0.14.0", default-features = false, features = ["randr", "shape", "xkb"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
case_sensitive_file_extension_comparisons = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
default_trait_access = "allow"
float_cmp = "allow"
fn_params_excessive_bools = "allow"
format_collect = "allow"
format_push_string = "allow"
large_enum_variant = "allow"
manual_clamp = "allow"
many_single_char_names = "allow"
match_same_arms = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
needless_pass_by_value = "allow"
range_plus_one = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
struct_field_names = "allow"
too_many_lines = "allow"
unnecessary_wraps = "allow"
unused_self = "allow"
used_underscore_binding = "allow"
wildcard_imports = "allow"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.release.package.flamewm-render-compiler]
opt-level = 2

[profile.release.build-override]
opt-level = 2

# Development .deb / dev-lane profile. Never used for production packages.
[profile.fast]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true

[profile.fast.build-override]
opt-level = 0

[profile.dev]
debug = "line-tables-only"

[profile.dev.build-override]
opt-level = 2

[profile.dev.package."*"]
debug = 0
