[package]
name = "flamewm-render-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Dependency-free precompiled system-UI runtime core for FlameWM Render"

[lib]
path = "src/lib.rs"

[dependencies]
flamewm-image-core = { path = "../flamewm-image-core" }
fontdue = "=0.9.5"

[dev-dependencies]
# Integration tests only (tests/): compiles the shipped ui/ pages. The compiler depends on this crate.
flamewm-render-compiler = { path = "../flamewm-render-compiler" }
