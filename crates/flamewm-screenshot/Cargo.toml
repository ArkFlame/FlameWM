[package]
name = "flamewm-screenshot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "flamewm-screenshot"
path = "src/main.rs"

[dependencies]
flamewm-api = { path = "../flamewm-api" }
flamewm-clipboard = { path = "../flamewm-clipboard" }
flamewm-dbus-reactor = { path = "../flamewm-dbus-reactor" }
x11rb = { workspace = true, features = ["randr", "xfixes", "shm"] }
png = "=0.18.1"
# Native Wayland full-output capture through zwlr-screencopy (see src/wayland.rs).
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

[lints]
workspace = true
