[package]
name = "flamewm-render-x11"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Minimal native X11 backend for FlameWM Render"

[dependencies]
flamewm-render-core = { path = "../flamewm-render-core" }
flamewm-reactor = { path = "../flamewm-reactor" }
flamewm-profiler = { path = "../flamewm-profiler" }
flamewm-image-core = { path = "../flamewm-image-core" }
calloop.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "flamewm-render-x11"
path = "src/bin/flamewm-render-x11.rs"

[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"

[dev-dependencies]
x11rb = { workspace = true, features = ["xtest"] }
