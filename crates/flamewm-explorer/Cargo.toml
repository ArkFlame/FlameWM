[package]
name = "flamewm-explorer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "FlameWM native file explorer"

[dependencies]
flamewm-api = { path = "../flamewm-api" }
flamewm-applications = { path = "../flamewm-applications" }
flamewm-control-core = { path = "../flamewm-control-core" }
flamewm-control-dbus = { path = "../flamewm-control-dbus" }
flamewm-dbus-reactor = { path = "../flamewm-dbus-reactor" }
flamewm-desktop-core = { path = "../flamewm-desktop-core" }
flamewm-ui-core = { path = "../flamewm-ui-core" }
flamewm-ui-x11 = { path = "../flamewm-ui-x11" }
flamewm-reactor = { path = "../flamewm-reactor" }
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
inotify = { workspace = true }
rustix = { workspace = true }

[build-dependencies]
flamewm-render-compiler = { path = "../flamewm-render-compiler" }

[lints]
workspace = true

[[bin]]
name = "flamewm-explorer"
path = "src/main.rs"
