[package]
name = "flamewm-wm-wayland"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "FlameWM Wayland compositor (smithay): nested winit backend with XWayland; drm tty backend behind the drm feature"
publish = false

[[bin]]
name = "flamewm-wayland"
path = "src/main.rs"

[dependencies]
calloop = { workspace = true }
flamewm-api = { path = "../flamewm-api" }
flamewm-applications = { path = "../flamewm-applications" }
flamewm-control-dbus = { path = "../flamewm-control-dbus" }
flamewm-control-wire = { path = "../flamewm-control-wire" }
flamewm-platform = { path = "../flamewm-platform" }
flamewm-reactor = { path = "../flamewm-reactor" }
flamewm-session-core = { path = "../flamewm-session-core" }
flamewm-skin = { path = "../flamewm-skin" }
# A direct `log` dependency only so this crate can install a subscriber for smithay's own
# diagnostics; the crate is already in the dependency graph through smithay.
log = "0.4"
# xcursor theme files for the compositor-drawn pointer; already in the graph through winit.
xcursor = "0.3"
rustix = { workspace = true, features = ["process"] }
dbus = { workspace = true, optional = true }
smithay = { version = "0.7", default-features = false, features = [
    "backend_winit",
    "backend_egl",
    "renderer_glow",
    "wayland_frontend",
    "desktop",
    "xwayland",
] }
fontdue = { version = "0.9", default-features = false }

[features]
# Real-hardware tty backend (logind session over D-Bus, udev, DRM/KMS, GBM, libinput). Needs the libinput,
# libgbm and libdrm development files at build time only; selected at runtime with FLAMEWM_WAYLAND_BACKEND=drm.
# No libseat: the session comes from systemd-logind, so the binary links only desktop-stock libraries.
drm = [
    "dep:dbus",
    "smithay/backend_drm",
    "smithay/backend_gbm",
    "smithay/backend_libinput",
    "smithay/backend_session",
    "smithay/backend_udev",
]

[dev-dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }

# The workspace forbids unsafe code; this crate denies it so the drm module (feature `drm`) can allow it
# for smithay's EGL initialisation. A module-level allow cannot override `forbid`.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
case_sensitive_file_extension_comparisons = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
default_trait_access = "allow"
float_cmp = "allow"
fn_params_excessive_bools = "allow"
format_collect = "allow"
format_push_string = "allow"
large_enum_variant = "allow"
manual_clamp = "allow"
many_single_char_names = "allow"
match_same_arms = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
needless_pass_by_value = "allow"
range_plus_one = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
struct_field_names = "allow"
too_many_lines = "allow"
unnecessary_wraps = "allow"
unused_self = "allow"
used_underscore_binding = "allow"
wildcard_imports = "allow"
