[package]
name = "flamewm-desktop"
autobins = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
flamewm-api = { path = "../flamewm-api" }
flamewm-weather = { path = "../flamewm-weather" }
flamewm-applications = { path = "../flamewm-applications" }
flamewm-control-core = { path = "../flamewm-control-core" }
flamewm-control-dbus = { path = "../flamewm-control-dbus" }
flamewm-control-wire = { path = "../flamewm-control-wire" }
flamewm-dbus-reactor = { path = "../flamewm-dbus-reactor" }
flamewm-desktop-core = { path = "../flamewm-desktop-core" }
flamewm-conversion-core = { path = "../flamewm-conversion-core" }
flamewm-clipboard = { path = "../flamewm-clipboard" }
flamewm-widgets-core = { path = "../flamewm-widgets-core" }
flamewm-downloads-core = { path = "../flamewm-downloads-core" }
flamewm-integrations-linux = { path = "../flamewm-integrations-linux" }
flamewm-profiler = { path = "../flamewm-profiler" }
flamewm-reactor = { path = "../flamewm-reactor" }
flamewm-debug = { path = "../flamewm-debug" }
flamewm-image-core = { path = "../flamewm-image-core" }
flamewm-ui-core = { path = "../flamewm-ui-core" }
flamewm-ui-document = { path = "../flamewm-ui-document" }
flamewm-ui-x11 = { path = "../flamewm-ui-x11" }
flamewm-session-core = { path = "../flamewm-session-core" }
calloop.workspace = true
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
inotify.workspace = true

[build-dependencies]
flamewm-render-compiler = { path = "../flamewm-render-compiler" }

[lints]
workspace = true

[dev-dependencies]
flamewm-ui-x11 = { path = "../flamewm-ui-x11", features = ["test-support"] }

[[bin]]
name = "flamewm-desktop"
path = "src/bin/flamewm-desktop.rs"
