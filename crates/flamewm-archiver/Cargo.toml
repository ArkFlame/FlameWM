[package]
name = "flamewm-archiver"
autobins = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "FlameWM archive core: list, extract, create and edit zip, tar, tar.gz, tar.xz, tar.bz2 and tar.zst archives with path-safety, progress and cancel"

[dependencies]
bzip2 = { version = "=0.6.1", default-features = false, features = ["bzip2-sys"] }
flate2 = "=1.1.10"
tar = "=0.4.46"
xz2 = "=0.1.7"
zip = { version = "=9.2.0", default-features = false, features = ["deflate"] }
zstd = { version = "=0.14.2", default-features = false }

[lints]
workspace = true
