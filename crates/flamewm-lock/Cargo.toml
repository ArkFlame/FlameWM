[package]
name = "flamewm-lock"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "FlameWM Breeze lock screen core (PAM authentication, settings, lock state)"

[dependencies]
calloop.workspace = true
flamewm-api = { path = "../flamewm-api" }
flamewm-control-core = { path = "../flamewm-control-core" }
flamewm-control-dbus = { path = "../flamewm-control-dbus" }
flamewm-dbus-reactor = { path = "../flamewm-dbus-reactor" }
flamewm-image-core = { path = "../flamewm-image-core" }
flamewm-reactor = { path = "../flamewm-reactor" }
flamewm-ribbons = { path = "../flamewm-ribbons" }
flamewm-ui-x11 = { path = "../flamewm-ui-x11" }
rustix = { workspace = true }

[dev-dependencies]
flamewm-ui-core = { path = "../flamewm-ui-core" }

[build-dependencies]
flamewm-render-compiler = { path = "../flamewm-render-compiler" }

[[bin]]
name = "flamewm-lock"
path = "src/main.rs"

[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
case_sensitive_file_extension_comparisons = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
default_trait_access = "allow"
float_cmp = "allow"
fn_params_excessive_bools = "allow"
format_collect = "allow"
format_push_string = "allow"
large_enum_variant = "allow"
manual_clamp = "allow"
many_single_char_names = "allow"
match_same_arms = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
needless_pass_by_value = "allow"
range_plus_one = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
struct_field_names = "allow"
too_many_lines = "allow"
unnecessary_wraps = "allow"
unused_self = "allow"
used_underscore_binding = "allow"
wildcard_imports = "allow"
